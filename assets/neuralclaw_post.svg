<text x="178" y="138" font-family="DejaVu Sans" font-size="62" font-weight="bold" fill="#eaf2ea" text-anchor="start">NeuralClaw</text>
<text x="180" y="182" font-family="DejaVu Sans Mono" font-size="26" font-weight="normal" fill="#00ff88" text-anchor="start">memoria activa local para Claude</text>
<line x1="60" y1="225" x2="1020" y2="225" stroke="#1d2a1f" stroke-width="2"/>
<rect x="50" y="255" width="980" height="150" rx="18" fill="#0e130f" stroke="#1d2a1f" stroke-width="2"/>
<rect x="50" y="255" width="6" height="150" rx="3" fill="#00ff88"/>
<text x="86" y="300" font-family="DejaVu Sans Mono" font-size="24" font-weight="bold" fill="#00ff88" text-anchor="start" letter-spacing="2">// ¿QUÉ ES?</text>
<text x="86" y="345" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#eaf2ea" text-anchor="start">Un Context OS local que recuerda las decisiones,</text>
<text x="86" y="380" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#eaf2ea" text-anchor="start">errores y variables de tu proyecto — entre sesiones.</text>
<rect x="50" y="440" width="980" height="280" rx="18" fill="#0e130f" stroke="#1d2a1f" stroke-width="2"/>
<rect x="50" y="440" width="6" height="280" rx="3" fill="#00ff88"/>
<text x="86" y="485" font-family="DejaVu Sans Mono" font-size="24" font-weight="bold" fill="#00ff88" text-anchor="start" letter-spacing="2">// ¿QUÉ HACE?</text>
<path d="M 96 533 L 104 541 L 96 549 L 88 541 Z" fill="#00ff88"/>
<text x="122" y="548" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#eaf2ea" text-anchor="start">Auto-recall al iniciar sesión</text>
<text x="122" y="578" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#8a988a" text-anchor="start">inyecta tu contexto relevante automáticamente</text>
<path d="M 96 608 L 104 616 L 96 624 L 88 616 Z" fill="#00ff88"/>
<text x="122" y="623" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#eaf2ea" text-anchor="start">Herramientas MCP de memoria</text>
<text x="122" y="653" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#8a988a" text-anchor="start">Claude lee y escribe contexto sobre la marcha</text>
<path d="M 96 683 L 104 691 L 96 699 L 88 691 Z" fill="#00ff88"/>
<text x="122" y="698" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#eaf2ea" text-anchor="start">Snapshot del contexto activo</text>
<text x="122" y="728" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#8a988a" text-anchor="start">una foto al instante de lo que importa ahora</text>
<rect x="50" y="755" width="980" height="280" rx="18" fill="#0e130f" stroke="#1d2a1f" stroke-width="2"/>
<rect x="50" y="755" width="6" height="280" rx="3" fill="#00ff88"/>
<text x="86" y="800" font-family="DejaVu Sans Mono" font-size="24" font-weight="bold" fill="#00ff88" text-anchor="start" letter-spacing="2">// ¿POR QUÉ AYUDA EN CLAUDE?</text>
<path d="M 96 848 L 104 856 L 96 864 L 88 856 Z" fill="#00ff88"/>
<text x="122" y="863" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#eaf2ea" text-anchor="start">Optimización de tokens</text>
<text x="122" y="893" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#8a988a" text-anchor="start">solo lo relevante, rankeado y con presupuesto</text>
<path d="M 96 923 L 104 931 L 96 939 L 88 931 Z" fill="#00ff88"/>
<text x="122" y="938" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#eaf2ea" text-anchor="start">Contexto persistente</text>
<text x="122" y="968" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#8a988a" text-anchor="start">sin re-explicar ni copiar y pegar nunca más</text>
<path d="M 96 998 L 104 1006 L 96 1014 L 88 1006 Z" fill="#00ff88"/>
<text x="122" y="1013" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#eaf2ea" text-anchor="start">100% local-first</text>
<text x="122" y="1043" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#8a988a" text-anchor="start">tu contexto vive en tu máquina, sin nube</text>
<rect x="50" y="1075" width="980" height="120" rx="14" fill="#05070a" stroke="#00ff88" stroke-width="2" opacity="0.95"/>
<circle cx="84" cy="1103" r="7" fill="#ff5f56"/>
<circle cx="110" cy="1103" r="7" fill="#ffbd2e"/>
<circle cx="136" cy="1103" r="7" fill="#00ff88"/>
<text x="170" y="1109" font-family="DejaVu Sans Mono" font-size="18" font-weight="normal" fill="#8a988a" text-anchor="start">bash</text>
<text x="84" y="1161" font-family="DejaVu Sans Mono" font-size="30" font-weight="bold" fill="#00ff88" text-anchor="start">$ </text>
<text x="118" y="1161" font-family="DejaVu Sans Mono" font-size="30" font-weight="bold" fill="#eaf2ea" text-anchor="start">neuralclaw cc install</text>
<rect x="510" y="1139" width="14" height="28" fill="#00ff88"/>
<text x="540.0" y="1265" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#00ff88" text-anchor="middle">Deja de copiar contexto. Empieza a construir.</text>
<text x="540.0" y="1300" font-family="DejaVu Sans Mono" font-size="20" font-weight="normal" fill="#8a988a" text-anchor="middle">github.com/maxsarlijagit/neuralclaw</text>
